# Single-machine production stack: Caddy ingress, API, worker, PostgreSQL,
# private S3-compatible storage (MinIO), and a one-shot migration service.
#
#   cp .env.production.example .env    # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Public exposure: only Caddy publishes ports. PostgreSQL and MinIO stay on the
# internal network. Use the "tunnel" profile for Cloudflare Tunnel access.
name: ai-job-coach

x-api-common: &api-common
  image: ai-job-coach-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 60s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coach}
      POSTGRES_USER: ${POSTGRES_USER:-coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coach} -d ${POSTGRES_DB:-coach}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio_data:/data

  # Creates the private bucket once MinIO is reachable, then exits 0.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-coach-private}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"; do
        echo "waiting for minio"; sleep 2;
      done;
      mc mb --ignore-existing "local/$$S3_BUCKET";
      mc anonymous set none "local/$$S3_BUCKET";
      echo "bucket ready";
      '

  # Runs exactly once per deploy; API and worker wait for it to finish.
  migrate:
    <<: *api-common
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-common
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *api-common
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  web:
    image: ai-job-coach-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Unset for tunnel mode (:80). Set to the public hostname for direct HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Optional: expose the stack without a public IP via Cloudflare Tunnel.
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - web

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
