[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-coach-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "pwdlib[argon2]>=0.2",
  "PyJWT>=2.9",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "httpx==0.27.2",
  "anyio==4.6.2.post1",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
]
pdf = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Distribute across CPU cores. The suite is DB-heavy and each test owns an
# isolated database file, so workers do not contend; measured 102s -> ~15s.
# Override with `-n 0` for a serial debugging run.
addopts = "-q -n auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
